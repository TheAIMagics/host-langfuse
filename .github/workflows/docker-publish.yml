name: Build and Push Langfuse Images

on:
  push:
    branches:
      - main
      - "feature/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [web, worker] # build both web + worker images

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4️⃣ Build + push Docker image
      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            thakursatya6397/langfuse-${{ matrix.service }}:latest
            thakursatya6397/langfuse-${{ matrix.service }}:${{ github.sha }}
          platforms: linux/amd64

      # ✅ Success message
      - name: Done
        run: echo "✅ ${{ matrix.service }} image built and pushed!"
